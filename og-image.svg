<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-description">
  <title id="og-title">SpecPort — catch AI review gaps before merge</title>
  <desc id="og-description">Check whether the final Git tree still matches the scope or pinned review you approved.</desc>
  <rect width="1200" height="630" fill="#f4f2ec"/>
  <circle cx="84" cy="72" r="5" fill="#1756c9"/>
  <text x="104" y="80" fill="#1756c9" font-family="Cascadia Code, Consolas, monospace" font-size="19" font-weight="700" letter-spacing="2">SPECPORT / LOCAL CLI</text>
  <text x="72" y="215" fill="#15181d" font-family="Bahnschrift, Aptos Display, Helvetica Neue, sans-serif" font-size="66" font-weight="600" letter-spacing="-2.5">Your coding agent says it’s done.</text>
  <text x="72" y="294" fill="#15181d" font-family="Bahnschrift, Aptos Display, Helvetica Neue, sans-serif" font-size="66" font-weight="600" letter-spacing="-2.5">Check the final tree.</text>
  <text x="76" y="362" fill="#626971" font-family="Aptos, Segoe UI, sans-serif" font-size="25">Verify that the scope or review you approved still covers the exact merge candidate.</text>
  <g transform="translate(72 435)">
    <rect width="620" height="82" rx="8" fill="#ffffff" stroke="#bdb9af" stroke-width="2"/>
    <rect width="620" height="25" rx="8" fill="#e9e6de"/>
    <text x="16" y="18" fill="#626971" font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">RUN IN A GIT REPOSITORY</text>
    <text x="18" y="59" fill="#15181d" font-family="Cascadia Code, Consolas, monospace" font-size="18" font-weight="600">$ npx --yes @specport/specport@latest coverage</text>
  </g>
  <g transform="translate(770 118)">
    <rect width="360" height="400" rx="16" fill="#111923"/>
    <rect x="282" width="78" height="5" fill="#c94e25"/>
    <text x="28" y="48" fill="#8da1b4" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">EXAMPLE FIXTURE</text>
    <text x="28" y="86" fill="#ffffff" font-family="Bahnschrift, Aptos Display, sans-serif" font-size="27" font-weight="600">One file escaped review.</text>
    <line x1="28" y1="112" x2="332" y2="112" stroke="#2a3948"/>
    <text x="28" y="145" fill="#8da1b4" font-family="Cascadia Code, Consolas, monospace" font-size="11">COVERAGE</text>
    <text x="28" y="174" fill="#ffb497" font-family="Cascadia Code, Consolas, monospace" font-size="24" font-weight="700">PARTIAL</text>
    <text x="192" y="145" fill="#8da1b4" font-family="Cascadia Code, Consolas, monospace" font-size="11">FINAL / REVIEWED</text>
    <text x="192" y="174" fill="#ffffff" font-family="Cascadia Code, Consolas, monospace" font-size="24" font-weight="700">8 / 7</text>
    <rect x="28" y="206" width="304" height="76" rx="7" fill="#261d1b" stroke="#774332"/>
    <text x="44" y="233" fill="#ffb497" font-family="Cascadia Code, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">UNREVIEWED</text>
    <text x="44" y="260" fill="#ffffff" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="600">src/retry-policy.ts</text>
    <line x1="28" y1="313" x2="332" y2="313" stroke="#2a3948"/>
    <text x="28" y="344" fill="#8da1b4" font-family="Cascadia Code, Consolas, monospace" font-size="11">NEXT ACTION</text>
    <text x="28" y="372" fill="#d8e1e9" font-family="Aptos, Segoe UI, sans-serif" font-size="16">Review the uncovered path</text>
  </g>
</svg>
